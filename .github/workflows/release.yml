name: Release

# Push a tag like v0.1.0 to build the Windows app and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      APP_FOLDER: dist/AutoDrive Editor
      ZIP_NAME: AutoDrive-Editor-${{ github.ref_name }}-windows.zip
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python packaging/release_notes.py "${{ github.ref_name }}" build/release_notes.md
      - run: pip install -r requirements-dev.txt pyinstaller
      - run: python -m pytest

      - run: python packaging/version_info.py build/version_info.txt

      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name "AutoDrive Editor"
          --icon packaging/app.ico --version-file build/version_info.txt
          --add-data "autodrive_editor/resources;autodrive_editor/resources"
          --add-data "CHANGELOG.md;."
          main.py

      - name: Add license files and zip
        run: |
          Copy-Item LICENSE, README.md, README.de.md, MANUAL.md, MANUAL.de.md, CHANGELOG.md, packaging/LGPL-3.0.txt, packaging/THIRD_PARTY_NOTICES.md "$env:APP_FOLDER"
          Compress-Archive -Path "$env:APP_FOLDER" -DestinationPath "$env:ZIP_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ZIP_NAME" --title "${{ github.ref_name }}" --notes-file build/release_notes.md
